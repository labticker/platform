# Protected deploy workflow replaces only this approved assigned-origin placeholder.
app = "REPLACE_WITH_ASSIGNED_APP"
primary_region = "yyz"
kill_signal = "SIGTERM"
kill_timeout = 60
[build]
  dockerfile = "Dockerfile"
[env]
  NODE_ENV = "production"
  PORT = "8080"
  APP_URL = "https://REPLACE_WITH_ASSIGNED_APP.fly.dev"
  AUTH_URL = "https://REPLACE_WITH_ASSIGNED_APP.fly.dev"
  GITHUB_OAUTH_ENABLED = "true"
  OWNER_ACCEPTANCE_ONLY = "REPLACE_WITH_OWNER_ACCESS"
  POSTHOG_PROJECT_ID = "REPLACE_WITH_POSTHOG_PROJECT"
  POSTHOG_API_HOST = "REPLACE_WITH_POSTHOG_API_HOST"
  POSTHOG_MEASUREMENT_START_DATE = "REPLACE_WITH_MEASUREMENT_START"
  EMAIL_DELIVERY_MODE = "mock"
  PUBLIC_EMAIL_ENABLED = "false"
  ADS_ENABLED = "false"
  EMAIL_SPONSORS_ENABLED = "false"
  WEB_AD_PROVIDER = "none"
  WORKER_ENABLED = "true"
  WORKER_MODE = "mock-pilot"
  WORKER_TICK_INTERVAL_MS = "900000"
  ADMIN_GITHUB_ACCOUNT_ID = "18339050"
  SENDER_IDENTITY = "LabTicker mock pilot — no outbound messages"
  SENDER_CONTACT = "Contact the LabTicker maintainer through the public platform repository"
[processes]
  web = "pnpm --filter @labticker/web start --hostname 0.0.0.0 --port 8080"
  worker = "pnpm exec tsx apps/worker/src/main.ts"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]
  [[http_service.checks]]
    interval = "60s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/api/live"
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web", "worker"]
