# Generated workflow config replaces app/origin from the actual approved slug.
app = "REPLACE_WITH_ASSIGNED_APP"
primary_region = "yyz"
kill_signal = "SIGTERM"
kill_timeout = 60

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  APP_URL = "https://REPLACE_WITH_ASSIGNED_APP.fly.dev"
  AUTH_URL = "https://REPLACE_WITH_ASSIGNED_APP.fly.dev"
  EMAIL_DELIVERY_MODE = "mock"
  PUBLIC_EMAIL_ENABLED = "false"
  ADS_ENABLED = "false"
  EMAIL_SPONSORS_ENABLED = "false"
  WEB_AD_PROVIDER = "none"
  WORKER_ENABLED = "false"

[processes]
  web = "pnpm --filter @labticker/web start --hostname 0.0.0.0 --port 8080"
  worker = "pnpm exec tsx apps/worker/src/main.ts"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web", "worker"]
