name: Owner-approved Fly app allocation
on:
  workflow_dispatch:
    inputs:
      app:
        description: Owner-approved available slug
        required: true
      organization:
        description: Authorized Fly organization slug
        required: true
      budget_approval:
        description: Owner quota/billing approval reference
        required: true
permissions:
  contents: read
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    environment: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Validate request
        env:
          APP: ${{ inputs.app }}
          ORG: ${{ inputs.organization }}
          APPROVAL: ${{ inputs.budget_approval }}
        run: |
          [[ "$APP" =~ ^[a-z][a-z0-9-]{2,50}$ ]] || exit 1
          [[ "$ORG" =~ ^[a-z0-9-]+$ ]] || exit 1
          test -n "$APPROVAL"
      - name: Install pinned Fly CLI
        run: |
          curl -fsSL https://github.com/superfly/flyctl/releases/download/v0.5.1/flyctl_0.5.1_Linux_x86_64.tar.gz -o /tmp/flyctl.tar.gz
          tar -xzf /tmp/flyctl.tar.gz -C /tmp flyctl
          sudo install /tmp/flyctl /usr/local/bin/flyctl
      - name: Allocate approved app only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROVISION_TOKEN }}
          APP: ${{ inputs.app }}
          ORG: ${{ inputs.organization }}
        run: flyctl apps create "$APP" --org "$ORG"
