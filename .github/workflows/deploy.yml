name: Approved Fly preview deployment
on:
  workflow_dispatch:
    inputs:
      app:
        description: Actual approved Fly app slug (no assumed ownership)
        required: true
      backup_reference:
        description: Reviewed Neon backup/restore evidence reference
        required: true
      approval_reference:
        description: Owner approval for deployment and reviewed migrations
        required: true
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.30.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm catalog:validate && pnpm build
      - name: Validate reviewed deployment inputs
        env:
          ACTUAL_APP: ${{ inputs.app }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          [[ "$ACTUAL_APP" =~ ^[a-z][a-z0-9-]{2,50}$ ]] || exit 1
          test -n "$BACKUP_REFERENCE" && test -n "$APPROVAL_REFERENCE"
          sed "s/REPLACE_WITH_ASSIGNED_APP/$ACTUAL_APP/g" fly.example.toml > fly.toml
      - name: Install pinned Fly CLI
        run: |
          curl -fsSL https://github.com/superfly/flyctl/releases/download/v0.5.1/flyctl_0.5.1_Linux_x86_64.tar.gz -o /tmp/flyctl.tar.gz
          tar -xzf /tmp/flyctl.tar.gz -C /tmp flyctl
          sudo install /tmp/flyctl /usr/local/bin/flyctl
          flyctl version
      - name: Apply approved migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_APPROVED: 'true'
        run: pnpm exec tsx scripts/migrate.ts
      - name: Deploy web preview only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.toml --process-groups web --remote-only --build-arg CATALOG_GIT_SHA="$GITHUB_SHA" --image-label "$GITHUB_SHA" --ha=false
      - name: Smoke web preview
        env:
          ACTUAL_APP: ${{ inputs.app }}
        run: |
          curl --fail --retry 6 --retry-delay 5 "https://$ACTUAL_APP.fly.dev/api/health" -o /tmp/health.json
          node -e 'const h=require("/tmp/health.json");if(h.service!=="LabTicker"||h.emailDeliveryMode!=="mock")process.exit(1)'
          echo 'Worker remains disabled until its independent acceptance gate passes.' >> "$GITHUB_STEP_SUMMARY"
